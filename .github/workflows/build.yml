name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "A2R_Console" --icon "app.ico" --add-data "pdftotext.exe;." --add-data "SumatraPDF.exe;." "main.py"

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: A2R-Console-App
        path: dist/A2R_Console/
