name: Build A2R POS Console

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        shell: pwsh
        run: |
          # رقم الإصدار بيتقري من collect.py (السطر APP_VERSION = "v...") — بيتغير لوحده مع كل نسخة
          $m = Select-String -Path collect.py -Pattern '^APP_VERSION\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $m) { Write-Error "APP_VERSION not found in collect.py"; exit 1 }
          $v = $m.Matches[0].Groups[1].Value
          if ($v -notmatch '^[A-Za-z0-9._-]+$') { Write-Error "Bad APP_VERSION: $v"; exit 1 }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EXE_NAME=A2R_SYSTEM_$v.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Version: $v"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyside6-essentials==6.12.0 pillow==13.0.0 reportlab==5.1.0 arabic-reshaper==3.1.0 python-bidi==0.6.12 openpyxl==3.1.5 pypdf==7.0.0 pyinstaller==6.22.3

      - name: Check files
        shell: pwsh
        run: |
          python -m py_compile collect.py
          foreach ($f in 'collect.py','app.ico','pdftotext.exe') {
            if (-not (Test-Path $f)) { Write-Error "Missing required file: $f"; exit 1 }
          }
          if (-not (Test-Path 'SumatraPDF.exe')) { Write-Warning "SumatraPDF.exe not found: printing falls back to default Windows printing." }

      - name: Build exe
        shell: pwsh
        run: |
          $pyArgs = @(
            '--clean','--noconsole','--onefile',
            '--name','A2R POS Console',
            '--icon=app.ico',
            '--add-data','app.ico;.',
            '--add-binary','pdftotext.exe;.',
            '--collect-all','reportlab',
            '--collect-all','arabic_reshaper',
            '--collect-all','bidi',
            '--hidden-import','pypdf',
            '--hidden-import','openpyxl',
            '--hidden-import','hmac',
            '--hidden-import','PySide6.QtSvg',
            '--exclude-module','tkinter',
            '--exclude-module','customtkinter'
          )
          if (Test-Path 'SumatraPDF.exe') { $pyArgs += @('--add-binary','SumatraPDF.exe;.') }
          $pyArgs += 'collect.py'
          python -m PyInstaller @pyArgs
          if (-not (Test-Path "dist/A2R POS Console.exe")) { Write-Error "Build failed"; exit 1 }

      - name: Name exe with version
        shell: pwsh
        run: |
          Copy-Item "dist/A2R POS Console.exe" "dist/$env:EXE_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: A2R SYSTEM ${{ env.APP_VERSION }}
          path: dist/${{ env.EXE_NAME }}

      - name: Publish release (keep latest two)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "build-${{ github.run_number }}"
          gh release create $tag "dist/$env:EXE_NAME" --title "A2R SYSTEM $env:APP_VERSION (build ${{ github.run_number }})" --notes "A2R SYSTEM $env:APP_VERSION - Built from ${{ github.sha }}"
          $old = gh release list --limit 100 --json tagName --jq '.[].tagName' | Where-Object { $_ -like "build-*" } | Select-Object -Skip 2
          foreach ($t in $old) { gh release delete $t --yes --cleanup-tag }
